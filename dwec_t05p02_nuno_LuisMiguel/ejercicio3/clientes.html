<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Librería Amigos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<header class="bg-primary text-white py-3">
    <div class="container">
        <h1 class="h4">Librería Amigos</h1>
    </div>
</header>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link active" href="clientes.html">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="libros.html">Libros</a></li>
                <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4 flex-grow-1">
    <h2>Insertar cliente</h2>
    
    <form id="formCliente" class="row g-3 mb-4 needs-validation" novalidate>
        <div class="col-md-4">
            <label class="form-label">DNI</label>
            <input type="text" id="dni" class="form-control" required pattern="[0-9]{8}[A-Za-z]">
            <div class="invalid-feedback">DNI inválido (8 números + letra)</div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Nombre</label>
            <input type="text" id="nombre" class="form-control" required>
            <div class="invalid-feedback">Introduce un nombre</div>
        </div>
        <div class="col-md-4">
            <label class="form-label">Dirección</label>
            <input type="text" id="direccion" class="form-control" required>
            <div class="invalid-feedback">Introduce una dirección</div>
        </div>
        <div class="col-12">
            <button class="btn btn-primary">Crear cliente</button>
        </div>
    </form>

    <h2>Listado de clientes</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>DNI</th>
                <th>Nombre</th>
                <th>Dirección</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="tablaClientes"></tbody>
    </table>

    <div id="panelPedidos" class="mt-4 d-none">
        <h3>Pedidos del cliente</h3>
        <div id="listaPedidos" class="row g-3"></div>
    </div>

    <div class="text-end mt-4">
        <button id="btnSubir" class="btn btn-secondary">Subir arriba</button>
    </div>
</main>

<footer class="bg-light py-3 mt-auto">
    <div class="container text-center">
        <p class="mb-0">&copy; 2025 - 2º DAW - Luis Miguel Nuño</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/ejercicio01_libros.js"></script>
<script src="js/ejercicio01_clientes.js"></script>
<script src="js/ejercicio01_tiposEnvios.js"></script>
<script src="js/ejercicio01_pedidos.js"></script>
<script src="js/ejercicio01_tienda.js"></script>
<script src="js/ejercicio03.js"></script>
</body>
</html>
