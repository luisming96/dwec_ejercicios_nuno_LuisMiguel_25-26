    </div>
</header>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

                <li class="nav-item"><a class="nav-link active" href="libros.html">Libros</a></li>

            </ul>
        </div>
    </div>
</nav>

<main class="container my-4 flex-grow-1">
    <h2>Insertar libro</h2>
    
    <form id="formLibro" class="needs-validation" novalidate>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="isbn" class="form-label">ISBN</label>
                <input type="text" id="isbn" class="form-control" required>
                <div class="invalid-feedback">ISBN inválido o ya existe</div>
            </div>
            <div class="col-md-6">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" id="titulo" class="form-control" required>
                <div class="invalid-feedback">Introduce un título</div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="genero" class="form-label">Género</label>
                <select id="genero" class="form-select" required>
                    <option value="">Selecciona un género...</option>
                </select>
                <div class="invalid-feedback">Selecciona un género válido</div>
            </div>
            <div class="col-md-6">
                <label for="precio" class="form-label">Precio (sin IVA)</label>
                <input type="number" id="precio" class="form-control" required min="0" step="0.01">
                <div class="invalid-feedback">Precio inválido</div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12">
                <label class="form-label">Tipo</label>
                <div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipo" id="tipoFisico" value="fisico" required>
                        <label class="form-check-label" for="tipoFisico">Libro físico</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipo" id="tipoEbook" value="ebook" required>
                        <label class="form-check-label" for="tipoEbook">Ebook</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-3" id="camposFisico" style="display: none;">
            <div class="col-md-4">
                <label for="peso" class="form-label">Peso (gramos)</label>
                <input type="number" id="peso" class="form-control" min="0">
            </div>
            <div class="col-md-4">
                <label for="dimensiones" class="form-label">Dimensiones (cm)</label>
                <input type="text" id="dimensiones" class="form-control" placeholder="20x15x2">
            </div>
            <div class="col-md-4">
                <label for="stock" class="form-label">Stock</label>
                <input type="number" id="stock" class="form-control" min="0" value="0">
            </div>
        </div>

        <div class="row g-3 mb-3" id="camposEbook" style="display: none;">
            <div class="col-md-6">
                <label for="formato" class="form-label">Formato</label>
                <select id="formato" class="form-select">
                    <option value="">Selecciona formato...</option>
                    <option value="PDF">PDF</option>
                    <option value="EPUB">EPUB</option>
                    <option value="MOBI">MOBI</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="tamano" class="form-label">Tamaño (MB)</label>
                <input type="number" id="tamano" class="form-control" min="0" step="0.1">
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-8">
                <label for="autoresExistentes" class="form-label">Autores existentes (Ctrl + clic para varios)</label>
                <select id="autoresExistentes" class="form-select" size="5" multiple></select>
            </div>
            <div class="col-md-4">
                <label for="nuevoAutor" class="form-label">Nuevo autor</label>
                <input type="text" id="nuevoAutor" class="form-control" placeholder="Nuevo autor">
                <div class="invalid-feedback">El autor ya existe</div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Insertar libro</button>
                <button type="reset" class="btn btn-secondary">Limpiar</button>
            </div>
        </div>
    </form>

    <div id="panelLibroCreado" class="mt-4"></div>
</main>
