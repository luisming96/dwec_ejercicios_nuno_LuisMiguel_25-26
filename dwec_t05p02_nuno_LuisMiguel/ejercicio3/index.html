<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Librería Amigos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<header class="bg-primary text-white py-3">
    <div class="container">
        <h1 class="h4">Librería Amigos</h1>
    </div>
</header>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link active" href="index.html">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="libros.html">Libros</a></li>
                <li class="nav-item"><a class="nav-link" href="pedidos.html">Pedidos</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4 flex-grow-1">
    <h2>Catálogo de libros</h2>
    
    <div class="row mb-3">
        <div class="col-md-6">
            <div class="input-group">
                <input type="text" id="inputBuscar" class="form-control" placeholder="Buscar por título, género o autor">
                <button id="btnBuscar" class="btn btn-primary">Buscar</button>
            </div>
        </div>
    </div>

    <div id="mensajeSinResultados" class="alert alert-info d-none">
        No se han encontrado libros con ese criterio.
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ISBN</th>
                <th>Título</th>
                <th>Autores</th>
                <th>Género</th>
                <th>Precio</th>
                <th>Tipo</th>
                <th>Stock</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="tablaLibros"></tbody>
    </table>
</main>

<div class="modal fade" id="modalLibro" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitulo"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><strong>ISBN:</strong> <span id="modalISBN"></span></p>
                <p><strong>Autores:</strong> <span id="modalAutores"></span></p>
                <p><strong>Género:</strong> <span id="modalGenero"></span></p>
                <p><strong>Precio:</strong> <span id="modalPrecio"></span></p>
                <p><strong>Tipo:</strong> <span id="modalTipo"></span></p>
                <p><strong>Stock / Disponibilidad:</strong> <span id="modalStock"></span></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<footer class="bg-light py-3 mt-auto">
    <div class="container text-center">
        <p class="mb-0">&copy; 2025 - 2º DAW - Luis Miguel Nuño</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/ejercicio01_util.js"></script>
<script src="js/ejercicio01_leer_datos.js"></script>
<script src="js/ejercicio01_autor.js"></script>
<script src="js/ejercicio01_libro.js"></script>
<script src="js/ejercicio01_cliente.js"></script>
<script src="js/ejercicio01_tipoEnvio.js"></script>
<script src="js/ejercicio01_pedido.js"></script>
<script src="js/ejercicio01_autores.js"></script>
<script src="js/ejercicio01_libros.js"></script>
<script src="js/ejercicio01_clientes.js"></script>
<script src="js/ejercicio01_tiposEnvios.js"></script>
<script src="js/ejercicio01_pedidos.js"></script>
<script src="js/ejercicio01_tienda.js"></script>
<script src="js/ejercicio03.js"></script>
</body>
</html>
