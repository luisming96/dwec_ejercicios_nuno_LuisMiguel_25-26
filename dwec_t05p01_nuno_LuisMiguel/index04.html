<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 04</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <header class="bg-primary text-white py-4 mb-4">
        <div class="container">
            <h1 class="h3 mb-0">Ejercicio 04 - listado de alimentos</h1>
        </div>
    </header>

    <main class="container my-4 p-3 border">
        <h3>Lista de Alimentos</h3>
        <div class="mt-3">
            <input type="text" id="inputAlimento" class="form-control mb-3" placeholder="Introduce un alimento">
            <button id="btnAdd" class="btn btn-success">Añadir elemento</button>
            <button id="btnDelete" class="btn btn-danger">Borrar elemento</button>
            <button id="btnList" class="btn btn-primary" disabled>Ordenar alfabéticamente</button>
        </div>
        <ul id="listaAlimentos" class="list-group mt-3"></ul>
    </main>

    <footer class="bg-dark text-white py-3 mt-5">
        <div class="container text-center">
            <p class="mb-0 small">&copy; 2025 - Ejercicios JavaScript con Bootstrap</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ejercicio04.js"></script>
</body>
</html>
